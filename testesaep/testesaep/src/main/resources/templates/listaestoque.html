<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Lista de Estoque</title>

    <!-- Adicione os links para os arquivos CSS do Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body>

<!-- Barra de navegação -->
<nav class="navbar navbar-expand-md navbar-dark .navbar.navbar-default.navbar-static-top bg-dark">
    <!-- Logo/marca principal da barra -->
    <a class="navbar-brand mb-0 h1 ms-5 me-5" href="listaproduto.html">Senai</a>

    <form class="d-flex ms-5 me-5" th:action="@{/logout}" th:method="Post">
        <button class="btn btn btn-outline-light my-2 my-sm-0 justify-content-end" type="submit">Logout</button>
    </form>
</nav>
<!-- Fim barra de navegação -->

<!-- Begin Page Content -->
<div class="container mt-3">

    <!-- DataTales Example -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 style="display: inline-block;" class="m-0 font-weight-bold text-primary">Estoque</h6>
            <p class="card-text" style="text-align: right; margin-left: 100px;display: inline-block; " >
                <a th:href="@{'/entradaestoque/' + ${produtoId}}" class="btn btn-primary">Entrada de estoque</a>
            </p>
            <p class="card-text" style="text-align: right; margin-left: 30px;display: inline-block; " >
                <a th:href="@{'/saidaestoque/' + ${produtoId}}" class="btn btn-primary">Retirar estoque</a>
            </p>
        </div>
        <div class="card-body">
            <!-- Formulário de Login com Thymeleaf -->
            <div class="table-responsive">
                <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                    <!-- Inicio do HTML do título da TABELA -->
                    <thead>
                    <tr>
                        <th>Id</th>
                        <th>Entrada</th>
                        <th>Saida</th>
                        <th>Data</th>
                        <th>Hora</th>
                        <th>Responsável</th>
                    </tr>
                    </thead>

                    <!-- Inicio do HTML dos dados TABELA -->
                    <tbody>

                    <!-- Objeto que irá conter uma lista de usuários
                        Essa lista precisa ter os atributos das colunas
                    -->
                    <tr th:each="estoque: ${listaestoque}">

                        <td th:text="${estoque.id}"></td>
                        <td th:text="${estoque.qtdEntrada}"></td>
                        <td th:text="${estoque.qtdSaida}"></td>
                        <td th:text="${estoque.data}"></td>
                        <td th:text="${estoque.hora}"></td>
                        <td th:text="${estoque.usuario}"></td>

                    </tr>

                    </tbody>
                </table>

            </div>

                <!-- Botões do formulário -->
                <div class="pt-1 mb-4">
                    <!-- Link para fechar e retornar para a pagina de lista de usuários -->
                    <a th:href="@{/listaproduto}" class="btn btn-secondary mb-2 me-2">Fechar</a>

                </div>

            <div th:if="${param.ins_sucesso}" class="alert alert-info" role="alert">
                <span class="mensagem">Cadastro realizado com sucesso!</span>
            </div>

            <div th:if="${param.upd_sucesso}" class="alert alert-info" role="alert">
                <span class="mensagem">Cadastro atualizado com sucesso</span>
            </div>

        </div>
    </div>
</div>


<!-- Rodapé -->
<footer class="container">
    <p>© Turma 2022-2023</p>
</footer>
<!-- Fim Rodapé -->

</body>
</html>
